[project]
name = "ocr-proofread"
version = "0.1.0"
description = "OCR 校对 / 图像 ROI 标注工具（PySide6 + QGraphicsView）"
readme = "README.md"
authors = [
    { name = "smalllqiang", email = "F11F10E8@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "manga-ocr>=0.1.16",
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
ocr-proofread = "ocr_proofread:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
